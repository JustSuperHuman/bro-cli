[package]
name = "bro-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "bro data layer: config, profiles, providers, sessions, usage, credentials, launch specs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
dirs.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
chrono.workspace = true
ureq.workspace = true
memchr.workspace = true
url.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
