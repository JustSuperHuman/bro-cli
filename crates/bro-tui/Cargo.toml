[package]
name = "bro-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "bro — the agentic terminal workspace for Claude Code, Codex, Pi and omp"
build = "build.rs"

[[bin]]
name = "bro"
path = "src/main.rs"

[[bin]]
name = "bro-app"
path = "src/bin/bro-app.rs"


[features]
default = ["gui"]
# the desktop app (`bro gui`): wgpu renderer, alacritty_terminal screens, photo and video previews, HTML pages, MCP apps
gui = ["dep:bro-gfx", "dep:bro-media", "dep:winit", "dep:alacritty_terminal", "dep:image", "dep:arboard", "dep:wry", "dep:objc2-foundation", "dep:objc2-web-kit", "dep:webview2-com", "dep:windows"]

[dependencies]
bro-core.workspace = true
bro-proxy.workspace = true
bro-bridge.workspace = true
bro-host.workspace = true
bro-voice.workspace = true
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
parking_lot.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
portable-pty.workspace = true
vt100.workspace = true
notify.workspace = true
unicode-width.workspace = true
uuid.workspace = true
png.workspace = true
base64.workspace = true
url = "2"
# file preview highlighting: pure-Rust regex engine (no oniguruma), bat's extra grammars (TypeScript, TOML…)
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# desktop app
bro-gfx = { path = "../bro-gfx", optional = true }
bro-media = { path = "../bro-media", optional = true }
winit = { version = "0.30.13", optional = true }
alacritty_terminal = { version = "0.26", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# image-data: the media panel's Copy puts pictures on the clipboard (macOS and Linux; Windows writes its own)
arboard = { version = "3.7", default-features = false, features = ["image-data"], optional = true }

# the desktop app's HTML previews: the system's web view (WebView2, WKWebView) over the preview card. Linux keeps
# the source: WebKitGTK would need a GTK loop beside winit's.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, optional = true }

# a local page loads with read access to its folder (WKWebView's loadFileURL; wry only has loadRequest)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"], optional = true }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKNavigation"], optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
# an MCP app's page clipped to the conversation as it scrolls: wry's own WebView2 controller and window
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi"] }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
