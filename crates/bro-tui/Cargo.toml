[package]
name = "bro-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "bro — the agentic terminal workspace for Claude Code, Codex, Pi and omp"
build = "build.rs"

[[bin]]
name = "bro"
path = "src/main.rs"

[[bin]]
name = "bro-app"
path = "src/bin/bro-app.rs"

[dependencies]
bro-core.workspace = true
bro-proxy.workspace = true
bro-bridge.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dirs.workspace = true
parking_lot.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
portable-pty.workspace = true
vt100.workspace = true
notify.workspace = true
unicode-width.workspace = true
uuid.workspace = true
png.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
