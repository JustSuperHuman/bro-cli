name: release

# Push a tag like v2.0.0 to build bro for every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build
        run: cargo build --release --locked -p bro-tui --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bro-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/bro.exe", "target/${{ matrix.target }}/release/bro-app.exe", packaging/bro-cli.cmd, README.md, LICENSE "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup builds bro-<tag>-<target>-setup.exe from the packaged folder (packaging/windows/bro.iss)
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $tag = "${{ github.ref_name }}"
          # a manual run builds from a branch: the version comes from Cargo.toml
          $version = if ($tag -match '^v\d') { $tag.Substring(1) } else { (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value }
          $name = "bro-$tag-${{ matrix.target }}"
          & $iscc /Q "/DAppVersion=$version" "/DBinDir=$PWD\dist\$name" "/DOutputName=$name-setup" "/O$PWD\dist" packaging/windows/bro.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="bro-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bro" packaging/bro-cli README.md LICENSE "dist/$name"
          chmod 755 "dist/$name/bro" "dist/$name/bro-cli"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        env:
          BRO_RELEASE_REF: ${{ github.ref_name }}
          BRO_RELEASE_TARGET: ${{ matrix.target }}
        run: bash packaging/macos/package.sh "$BRO_RELEASE_TARGET" "$BRO_RELEASE_REF"

      - uses: actions/upload-artifact@v4
        with:
          name: bro-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
          if-no-files-found: error

  release:
    name: publish
    needs: build
    # a platform that fails to build must not hold back the others from finishing; publishing requires every platform to succeed
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Require both macOS disk images
        env:
          BRO_RELEASE_REF: ${{ github.ref_name }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "dist/bro-$BRO_RELEASE_REF-$target.dmg"
          done

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
