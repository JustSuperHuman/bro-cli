[workspace]
resolver = "3"
members = ["crates/bro-core", "crates/bro-proxy", "crates/bro-bridge", "crates/bro-tui"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
bro-core = { path = "crates/bro-core" }
bro-proxy = { path = "crates/bro-proxy" }
bro-bridge = { path = "crates/bro-bridge" }

# shared
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", features = ["json"] }
vt100 = "0.16"

# async (proxy + bridge)
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
axum = { version = "0.8", features = ["json", "multipart", "query", "ws"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"
http = "1"
tower-http = { version = "0.6", features = ["compression-gzip", "cors"] }
tokio-tungstenite = "0.29"
tokio-stream = "0.1"
async-stream = "0.3"
if-addrs = "0.14"
json5 = "0.4"
qrcode = { version = "0.14", default-features = false }

# tui
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
notify = "8"
unicode-width = "0.2"
png = "0.18"

tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
